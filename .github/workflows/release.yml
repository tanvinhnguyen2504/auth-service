name: Build and Push to Artifact Registry

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read

env:
  GAR_LOCATION: asia-southeast1
  GAR_PROJECT_ID: vincent-mini-apps-project
  GAR_REPOSITORY: auth-repository
  IMAGE_NAME: auth-service
  WORKLOAD_IDENTITY_PROVIDER: projects/225614846438/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  SERVICE_ACCOUNT: github-actions@vincent-mini-apps-project.iam.gserviceaccount.com

jobs:
  verify:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0

      - name: Set up Go
        uses: actions/setup-go@v5.6.0
        with:
          go-version-file: 'go.mod'

      - name: Run Unit Tests
        run: go test -race ./...

  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: verify

    # id-token: write is what lets the runner mint the OIDC token that
    # Workload Identity Federation exchanges for a GCP access token.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.4.0

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2.1.13
        with:
          token_format: access_token
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3.7.0
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5.10.0
        with:
          images: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GAR_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # VERSION is stamped into the binary via -ldflags in the Dockerfile.
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
