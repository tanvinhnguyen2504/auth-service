name: Go Continuous Integration

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.4.0

      - name: Set up Go
        uses: actions/setup-go@v5.6.0
        with:
          go-version-file: 'go.mod'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8.0.0
        with:
          version: v2.1.6

  test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.4.0

      - name: Set up Go
        uses: actions/setup-go@v5.6.0
        with:
          go-version-file: 'go.mod'

      - name: Install Dependencies
        run: go mod download

      - name: Check Formatting
        run: test -z "$(gofmt -l .)"

      - name: Run Unit Tests
        run: go test -race ./...

      - name: Verify Build
        run: go build ./...
